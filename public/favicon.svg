  <!-- Luminous AI Sparkle Star -->
  <path d="M32 20 C32.5 24, 34 25.5, 38 26 C34 26.5, 32.5 28, 32 32 C31.5 28, 30 26.5, 26 26 C30 25.5, 31.5 24, 32 20 Z" fill="url(#auraGradient)" />
